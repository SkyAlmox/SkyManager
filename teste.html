<script>
(() => {
  const NS="http://www.w3.org/2000/svg";
  const trace=document.getElementById("trace");
  const g=document.getElementById("pulses");
  const L=trace.getTotalLength();

  const COUNT=6;
  const HEAD_MIN=80,HEAD_MAX=260;
  const DUR_MIN=3,DUR_MAX=7;
  const OP_MIN=0.35,OP_MAX=0.95;

  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[(Math.random()*a.length)|0];

  function makePulse(){
    const u=document.createElementNS(NS,"use");
    u.setAttribute("href","#trace");
    u.setAttribute("class","pulse");

    const head=rand(HEAD_MIN,HEAD_MAX);
    const dur=rand(DUR_MIN,DUR_MAX);
    const dir=pick([1,-1]);
    const op=rand(OP_MIN,OP_MAX);

    const startOffset=-rand(0,L);
    const endOffset=startOffset+(dir*-L);

    u.style.strokeDasharray=`${head} ${L}`;
    u.style.strokeDashoffset=`${startOffset}`;
    u.style.setProperty("--endOffset",String(endOffset));
    u.style.animationDuration=dur.toFixed(3)+"s";
    u.style.animationDelay=(-Math.random()*dur).toFixed(3)+"s";
    u.style.opacity=op.toFixed(3);

    g.appendChild(u);
    return u;
  }

  const pulses=[];
  for(let i=0;i<COUNT;i++)pulses.push(makePulse());

  setInterval(()=>{
    const howMany=Math.random()<0.6?1:2;
    for(let k=0;k<howMany;k++){
      const idx=(Math.random()*pulses.length)|0;
      pulses[idx].remove();
      pulses[idx]=makePulse();
    }
  },850);
})();
</script>
